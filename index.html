<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Echo</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: fit-content;
        height: fit-content;
        background: transparent;
        -webkit-app-region: no-drag;
      }

  .command-tab {
        height: 28px;
        background: #0c0c10;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 12px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 600;
        -webkit-app-region: drag;
        flex-wrap: nowrap;
        overflow: visible;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
  width: 100%;
  /* Allow horizontal collapse to approximately one icon's width */
  min-width: 60px;
      }

      .command-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        -webkit-app-region: no-drag;
  /* Allow items to shrink so the bar can collapse to one icon width */
  flex-shrink: 1;
      }

      .command-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .command-item i {
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .command-item span {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
      }

      .command-item.recording i {
        color: #ff4757;
        text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        animation: pulse 2s infinite;
      }

      .command-item.active {
        color: #4caf50;
        text-shadow: 0 1px 2px rgba(76, 175, 80, 0.3);
      }

      .command-item.active:hover {
        background: rgba(76, 175, 80, 0.15);
        color: #4caf50;
      }

      /* Small round info button */
      #infoButton {
        width: 26px;
        height: 26px;
        border-radius: 9999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #infoButton i { font-size: 14px; }
      #infoButton:hover {
        background: rgba(96, 165, 250, 0.18);
        color: #93c5fd;
        box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.25) inset;
      }

      .command-separator {
        width: 1px;
        height: 16px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.25),
          transparent
        );
        flex-shrink: 0;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transition: all 0.3s ease;
        position: relative;
  flex-shrink: 0;
      }

      .status-dot.interactive {
        background-color: #10b981; /* Green for active/interactive */
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        animation: pulse-green 2s infinite;
      }

      .status-dot.non-interactive {
        background: #f44336;
        box-shadow: 0 0 10px rgba(244, 67, 54, 0.692);
      }

      .hidden-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1000;
      }

      .hidden-indicator.show {
        opacity: 1;
      }

      #skillIndicator {
        color: #ffffff;
        transition: all 0.3s ease;
      }

      #skillIndicator:hover {
        color: #ffffff;
      }

      #skillIndicator.non-interactive {
        color: #ffffff;
        opacity: 0.7;
      }

      #skillIndicator.non-interactive:hover {
        background: rgba(76, 175, 80, 0.05);
        border-color: rgba(76, 175, 80, 0.15);
        color: #ffffff;
      }

      #settingsIndicator {
        color: #ffffff;
        transition: all 0.3s ease;
      }

      #settingsIndicator:hover {
        color: #ffa726;
        background: rgba(255, 167, 38, 0.15);
        text-shadow: 0 1px 2px rgba(255, 167, 38, 0.3);
      }

      #settingsIndicator.active {
        color: #ffa726;
        text-shadow: 0 1px 2px rgba(255, 167, 38, 0.3);
      }

      .command-item select {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        color: rgba(255, 255, 255, 0.95);
        font-size: 11px;
        font-weight: 600;
        outline: none;
        padding: 4px 8px;
        min-width: 65px;
        cursor: pointer;
        transition: all 0.2s ease;
        -webkit-app-region: no-drag;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'><path fill='%23ffffff' d='M2 0L0 2h4zm0 5L0 3h4z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 6px center;
        background-size: 8px 8px;
        padding-right: 20px;
      }

      .command-item select:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
        border-color: rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 1);
      }

      .command-item select:focus {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
        border-color: rgba(76, 175, 80, 0.6);
        box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
      }

      .command-item select option {
        background: rgba(30, 30, 30, 0.95);
        color: rgba(255, 255, 255, 0.9);
        padding: 4px 8px;
        font-weight: 500;
      }

      .command-item select option:checked {
        background: rgba(76, 175, 80, 0.8);
        color: white;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Info popover styles */
      .shortcuts-popover {
        position: absolute;
        top: 36px; /* below command bar */
        right: 8px;
        background: linear-gradient(
          135deg,
          rgba(20, 20, 20, 0.7) 0%,
          rgba(10, 10, 10, 0.6) 100%
        );
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.95);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        padding: 12px;
        min-width: 340px;
        z-index: 1000;
        -webkit-app-region: no-drag;
        /* Hidden by default: do not intercept clicks */
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 120ms ease, visibility 120ms ease;
      }

      /* Open state: visible and interactive */
      .shortcuts-popover.is-open {
        pointer-events: auto;
        opacity: 1;
        visibility: visible;
      }

      .shortcuts-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin: 2px 0 8px 0;
        color: #e6e6e6;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .shortcuts-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .shortcuts-table th,
      .shortcuts-table td {
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        vertical-align: middle;
      }

      .shortcuts-table th {
        text-align: left;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.9);
      }

      .kbd {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        padding: 3px 8px;
        font-weight: 600;
        color: #fff;
        box-shadow: inset 0 -1px 0 rgba(0,0,0,0.25);
        white-space: nowrap;
      }

      .shortcuts-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        padding-top: 10px;
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.7);
      }

      .shortcuts-footer a {
        color: #60a5fa; /* tailwind blue-400 */
        text-decoration: none;
      }

      .shortcuts-footer a:hover {
        text-decoration: underline;
      }

      /* ===== Echo (Cluely-style) main bar ===== */
      .echo-bar {
        background: #0c0c10;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        box-sizing: border-box;
        -webkit-app-region: drag;
        color: rgba(255, 255, 255, 0.92);
      }
      .echo-row { display: flex; align-items: center; gap: 8px; }
      .echo-row-top { gap: 8px; }
      .echo-logo {
        width: 26px; height: 26px; border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        background: #1c1c24; cursor: pointer; flex-shrink: 0;
        -webkit-app-region: no-drag; overflow: hidden;
      }
      .echo-logo img { width: 26px; height: 26px; object-fit: cover; }
      .echo-input {
        flex: 1; min-width: 0;
        background: #1c1c24;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        padding: 8px 12px;
        outline: none;
        -webkit-app-region: no-drag;
      }
      .echo-input::placeholder { color: rgba(255, 255, 255, 0.4); }
      /* Input pill with the Enter button INSIDE on the right. */
      .echo-input-wrap {
        flex: 1; min-width: 0; display: flex; align-items: center;
        background: #1c1c24; border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px; padding: 4px 4px 4px 12px; -webkit-app-region: no-drag;
      }
      .echo-input-wrap .echo-input {
        flex: 1; min-width: 0; background: transparent; border: none; padding: 6px 8px 6px 0;
      }
      .echo-enter {
        width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
        background: #2a2a33; border: none; color: #fff; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        -webkit-app-region: no-drag; transition: background .15s;
      }
      .echo-enter:hover { background: #3a3a45; }
      .echo-row-icons { gap: 4px; padding: 0 2px; }
      .echo-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; }
      .echo-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
      .echo-icon.paused { color: rgba(255,255,255,0.3); }
      .echo-icon {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 8px; border-radius: 7px;
        color: rgba(255, 255, 255, 0.7); font-size: 12px; cursor: pointer;
        -webkit-app-region: no-drag; transition: all .15s;
      }
      .echo-icon:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
      .echo-icon.active { color: #6E8BFF; }
      .echo-icon.mic-on { color: #4caf50; }
      .echo-spacer { flex: 1; }
      .echo-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.12); margin: 0 2px; }

      /* ===== Single-window hub body (chat + history), below the bar ===== */
      .echo-hub { width: 560px; display: flex; flex-direction: column; gap: 8px; }
      #hubBody {
        display: none;
        position: relative;
        background: rgba(12, 12, 16, 0.72);
        backdrop-filter: blur(22px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        -webkit-app-region: no-drag;
        overflow: hidden;
        flex-direction: column;
      }
      #hubBody.open { display: flex; }
      /* Drag handle to resize the chat/history panel (bottom-right corner). */
      #hubResize {
        position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px;
        cursor: nwse-resize; -webkit-app-region: no-drag; z-index: 5;
        background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.28) 50%, rgba(255,255,255,0.28) 60%, transparent 60%, transparent 72%, rgba(255,255,255,0.28) 72%, rgba(255,255,255,0.28) 82%, transparent 82%);
        border-bottom-right-radius: 12px;
      }
      .hub-section { display: none; flex-direction: column; min-height: 0; }
      .hub-section.active { display: flex; }
      /* Chat */
      #hubMessages { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 240px; max-height: 70vh; }
      .msg { display: flex; flex-direction: column; }
      .msg.user { align-items: flex-end; }
      .msg.user .bubble {
        background: #2a2a33; color: #fff; padding: 10px 14px;
        border-radius: 16px 16px 4px 16px; max-width: 80%; font-size: 13px; line-height: 1.45;
      }
      .msg.assistant .bubble { color: rgba(255,255,255,0.92); font-size: 13px; line-height: 1.55; }
      .msg.assistant .bubble p { margin: 0 0 8px; }
      .msg-img img { max-width: 220px; max-height: 150px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); cursor: zoom-in; }
      .msg-img img.expanded { max-width: 100%; max-height: none; cursor: zoom-out; }
      pre.code { background: rgba(0,0,0,0.45); border-radius: 8px; padding: 10px 12px; overflow-x: auto;
        font-family: Menlo, Monaco, monospace; font-size: 11.5px; color: #c7d0ff; position: relative; margin: 6px 0; }
      pre.code .copy { position: absolute; top: 6px; right: 6px; font-size: 10px; color: rgba(255,255,255,0.5); cursor: pointer; }
      .thinking .bubble::after { content: '•••'; animation: blink 1.2s infinite; color: rgba(255,255,255,0.5); }
      @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
      /* History */
      #hubHistory { padding: 8px; overflow-y: auto; min-height: 240px; max-height: 70vh; }
      /* Live transcript section */
      .t-live { display:flex; align-items:center; gap:6px; padding: 12px 16px 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); flex-shrink:0; }
      .t-auto { color: rgba(255,255,255,0.4); font-weight: 500; }
      .t-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; animation: blink 1.4s infinite; }
      #hubTranscript { padding: 4px 16px 14px; overflow-y: auto; min-height: 200px; max-height: 64vh; display:flex; flex-direction:column; gap:8px; }
      #hubTranscript .tline { font-size: 13px; line-height: 1.5; }
      #hubTranscript .tline .who { font-weight: 700; font-size: 11px; margin-right: 6px; }
      #hubTranscript .tline.me .who { color: #6E8BFF; }
      #hubTranscript .tline.them .who { color: #4caf50; }
      #hubTranscript .tline .txt { color: rgba(255,255,255,0.9); }
      #hubTranscript .tline.interim { color: rgba(255,255,255,0.45); font-style: italic; }
      #hubTranscript .t-empty { color: rgba(255,255,255,0.35); font-size: 13px; text-align:center; padding: 24px; }
      .hub-label { font-size: 10px; letter-spacing: .08em; color: rgba(255,255,255,0.35); text-transform: uppercase; padding: 10px 12px 6px; }
      .hub-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; cursor: pointer; gap: 10px; }
      .hub-row:hover { background: rgba(255,255,255,0.06); }
      .hub-row .t { font-size: 13px; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hub-row .meta { font-size: 11px; color: rgba(255,255,255,0.4); flex-shrink: 0; }
      .hub-date { width: 42px; height: 42px; border-radius: 10px; background: rgba(255,255,255,0.06); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; margin-right:10px; }
      .hub-date .m { font-size: 9px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
      .hub-date .d { font-size: 16px; font-weight: 700; color:#fff; line-height:1; }
      .hub-empty { color: rgba(255,255,255,0.35); font-size: 13px; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <div class="echo-hub" id="echoHub">
    <div class="echo-bar" id="echoBar">
      <!-- Top: ask input with the Enter button INSIDE the pill (right). -->
      <div class="echo-row echo-row-top">
        <div class="echo-input-wrap">
          <input class="echo-input" id="askInput" type="text" placeholder="Pregunta o busca lo que sea" />
          <button class="echo-enter" id="askSend" title="Preguntar (Enter)"><i class="fas fa-arrow-turn-down"></i></button>
        </div>
      </div>
      <!-- Bottom: logo (left) · centered actions · History (right). -->
      <div class="echo-row echo-row-icons">
        <div class="echo-logo" id="settingsButton" title="Ajustes">
          <img src="assests/icons/echo-logo.png" alt="Echo" onerror="this.style.display='none'" />
        </div>
        <div class="echo-center">
          <div class="echo-icon command-item" id="screenshotButton" title="Añadir contexto de pantalla (⌘⇧S)">
            <i class="fas fa-image"></i>
          </div>
          <div class="echo-icon" id="eyeButton" title="Detectable / indetectable">
            <i class="fas fa-eye"></i>
          </div>
          <div class="echo-icon mic-on" id="micInButton" title="Mi micrófono (input) — clic para pausar">
            <i class="fas fa-microphone"></i>
          </div>
          <div class="echo-icon mic-on" id="audioOutButton" title="Audio del sistema (output) — clic para pausar">
            <i class="fas fa-volume-high"></i>
          </div>
        </div>
        <div class="echo-right">
          <div class="echo-icon" id="transcriptButton" title="Transcripción en vivo (Yo / Interlocutor)">
            <i class="fas fa-closed-captioning"></i>
          </div>
          <div class="echo-icon" id="historyButton" title="Historial (↓)">
            <i class="fas fa-clock-rotate-left"></i><span>Historial</span>
          </div>
          <div class="status-dot non-interactive" id="statusDot"></div>
        </div>
        <div id="skillIndicator" style="display:none"></div>
        <div id="micButton" style="display:none"></div>
      </div>
    </div>

    <!-- Hub body: chat + history, in the SAME window (expands downward). -->
    <div id="hubBody">
      <div class="hub-section" id="hubChat">
        <div id="hubMessages"></div>
      </div>
      <div class="hub-section" id="hubHistorySec">
        <div id="hubHistory"></div>
      </div>
      <div class="hub-section" id="hubTranscriptSec">
        <div class="t-live"><span class="t-dot"></span> Transcript</div>
        <div id="hubTranscript"></div>
      </div>
      <div id="hubResize" title="Arrastra para ajustar el tamaño"></div>
    </div>
    </div>

    <script src="lib/markdown.js" onerror=""></script>
    <script src="./src/ui/main-window.js"></script>
    <script src="./src/ui/hub.js"></script>
  </body>
</html>
